<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            height: 97vh;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            margin: auto;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50% , -50% );
        }
        td{
            border: 1px solid black;
            text-align: center;
            vertical-align: middle;
        }
        .numero{
            text-align: right;
            vertical-align: bottom;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>a1</td>
            <td>a2</td>
            <td class="numero">a3</td>
        </tr>
        <tr>
            <td>a2</td>
            <td class="numero">b2</td>
            <td>c2</td>
        </tr>
        <tr>
            <td class="numero">
                a3
            </td>
            <td>b3</td>
            <td>c3</td>
        </tr>
    </table>
</body>
</html>
