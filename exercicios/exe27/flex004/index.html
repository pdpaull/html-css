<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        body{
            background-color: black;
        }
        h1{
            color: white;
        }
        .conteiner{
            height: 300px;
            background-color: burlywood; 
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }
        .item{
            background-color: aqua;
            border: 1px solid black;
            text-align: center; 
        }
    </style>
</head>
<body>
    <h1>Flexxxxx</h1>
    <div class="conteiner">
        <div class="item">Exemplo de bloco <strong>A</strong></div>
        <div class="item">Exemplo de bloco <strong>B</strong></div>
        <div class="item">Exemplo de bloco <strong>C</strong></div>
        <div class="item">Exemplo de bloco <strong>D</strong></div>
        <div class="item">Exemplo de bloco <strong>E</strong></div>
        <div class="item">Exemplo de bloco <strong>F</strong></div>
    </div>
</body>
</html>
