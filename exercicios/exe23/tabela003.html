<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{text-align: center;}
        table{
            width: 500px;
             position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50% , -50% );
            border-collapse: collapse;
        }
        caption{
            background-color: rgb(114, 58, 112);
            padding: 5px;
            color: white;
        }
        thead{
            background-color: olivedrab;
        }
       
        tbody > tr:nth-child(odd){
            background-color: orchid;
        }
        tbody > tr:nth-child(even){
            background-color: rgb(62, 83, 21);
        }
        .pal{
          text-align: center;  
        }
        td , th {
            border: 1px solid black;
            padding: 5px;
        }
        tfoot{
            background-color: olivedrab;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>Melhores jogadores</caption>
        <thead>
            <th scope="col">Jogadores</th>
            <th scope="col">Gols</th>
        </thead>
        <tbody>
            <tr>
                <td scope="row" class="pal"><strong>Paulo</strong></td>
                
                <td class="num">1000</td>
            </tr>
            <tr>
                <td scope="row" class="pal"><strong>Cristiano</strong></td>
                <td class="num">200</td>
            </tr>
            <tr>
                <td scope="row" class="pal"><strong>Jacinta</strong></td>
                <td class="num">40</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row">Totais de Gols</th>
            <td><strong>1240</strong></td>
        </tfoot>
    </table>

</body>
</html>
