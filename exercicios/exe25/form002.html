<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Atributos adicionais</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p><label for="nome">Nome:</label> 
            <input type="text" name="nome" id="nome" minlength="1" required placeholder="Digite o seu Nome" autocomplete="name">
        </p>
        <p><label for="sobrenome">Sobrenome:</label>
        <input type="text" name="sobrenome" id="sobrenome" minlength="1" required placeholder="Digite o seu Sobrenome" autocomplete="name">
        </p>
        <p><label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" minlength="8" required placeholder="Digite sua Senha" autocomplete="current-password">

        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
