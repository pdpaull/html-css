<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Sobrou alguma coisa para o Beta?</title>
</head>
<body>
     <h1>Escolhe aí betinha!!!</h1>
     <form method="get">
        <fieldset>
            <legend>Ela é ruiva ou loira</legend>
            <input type="radio" name="cabelo" value="L" id="loira"><label for="loira">Loira</label> <input type="color" name="loira" id="loira" value="#f5dda8"> <br>
            <input type="radio" name="cabelo" value="R" id="ruiva"><label for="ruiva">Ruiva</label> <input type="color" name="ruiva" id="ruiva" value="#c04000">
        </fieldset>
        <fieldset>
            <legend>O que vc mais gosta nela?</legend>

            <input type="checkbox" name="rabo" id="rabo"><label for="rabo">Rabo</label> <br>
            <input type="checkbox" name="beleza" id="beleza"><label for="beleza">Beleza</label> <br>
            <input type="checkbox" name="jeito" id="jeito"><label for="jeito">Jeito</label> <br> <br>
            <input type="range" name="sat" id="sat" min="1" max="10" value="1"><label for="sat">O quão você gosta dela?</label>
        </fieldset>

            <input type="submit" value="Enviar">

     </form>
</body>
</html>
