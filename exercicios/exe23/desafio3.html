<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios3</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif;}
            table{
                width: 600px; 
                height: 200px;
                border-collapse:collapse ;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%,-50%);
            }
            caption{
                padding: 10px;
                background-color: gray;
            }
            th , td{
                border: 1px solid black;
                padding: 10px;
                text-align: center;
            }
            thead , .med1, .med2{
                background-color:rgb(77, 77, 77);
                color: white;
            }
            .esq{
                text-align: left;
            }

       
    </style> 
</head>
<body>
    <table>
        <caption>Notas escolares</caption>
        <thead>
            <tr>
                <th scope="col" >Área</th>
                <th scope="col" >Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas 
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </th>
                <th scope="col">Média</th>
            </tr>
        </thead>
        <tbody>
            <tr>

       
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr> 
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="med1">
                <th colspan="4" scope="row" class="esq">Média de Exatas</th>
                <td>0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup" >Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr class="med2">
                <th colspan="4" scope="row" class="esq">Médias de Humanas</th>
                <td>0.0</td>
            </tr>
            
        </tbody>
    </table>
</body> 
</html>
