<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,password,mail" />
</head>
<body>
    <main>
        <div id="imagem"></div>
        <article>
            <h1>Login</h1>
            <p class="descricao">
                Seja bem-vindo(a) novamente.Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
            </p>
            <form action="" method="post" autocomplete="on" >
                <p class="email">
                    <label for="user">
                        <span class="material-symbols-outlined">person</span>
                    </label>

                    <input type="email" name="user" id="user" required placeholder="Seu email" >
                </p>
                <p class="senha">
                    <label for="senha">
                        <span class="material-symbols-outlined">password</span>
                    </label>

                    <input type="password" name="senha" id="senha" required placeholder="Seu senha" >
                </p>
                <p class="envio">
                    <input type="submit" value="Enviar" class="input1">
                </p>
                <p class="senha-esquecida" >
                    <input type="submit" value="Esqueci a senha " class="input2" id="es-senha">
                </p>
            </form>

        </article>
    </main>
</body>
</html>
